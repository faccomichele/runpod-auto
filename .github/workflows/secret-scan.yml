# Secret scan for the public repository.
# Fails the build if tokens, API keys or pre-signed URLs are committed.
#
# gitleaks-action is free for personal accounts. Organizations must provide a
# license: add a GITLEAKS_LICENSE repository secret and uncomment the line below.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
